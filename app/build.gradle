// The bundled microG GmsCore APK (~108 MB) is too large to commit to GitHub
// (100 MB file limit) and would bloat clones. Instead it is fetched once,
// on demand, from the official microG release. CI runners have fast GitHub
// access, so the artifact never needs to transit cellular data.
def microGAsset = file('src/main/assets/microg/gmscore.apk')
def microGUrl = 'https://github.com/microg/GmsCore/releases/download/v0.3.18.252432/com.google.android.gms-252432036.apk'
def microGSha256 = '1094fa60ace2367ac52bd08d1bd4f33fa8144ba930e355121b28234b8ebbf382'

tasks.register('ensureMicroGAsset') {
    outputs.file(microGAsset)
    onlyIf { !microGAsset.exists() || microGAsset.length() < 50 * 1024 * 1024L }
    doLast {
        def dest = microGAsset
        def parent = dest.parentFile
        if (!parent.isDirectory()) parent.mkdirs()
        if (dest.exists()) dest.delete()
        logger.lifecycle("Downloading microG GmsCore (${microGUrl})...")
        ant.get(src: microGUrl, dest: dest, skipexisting: false)
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(dest.bytes)
                .collect { String.format('%02x', it) }.join()
        if (digest != microGSha256) {
            dest.delete()
            throw new GradleException("microG APK checksum mismatch: ${digest}")
        }
        logger.lifecycle("microG GmsCore OK (${dest.length()} bytes, sha256 verified).")
    }
}

// The asset must be in place before any RELEASE asset-merge runs. Debug
// builds deliberately skip it: a ~108 MB asset inside every debug APK made
// CI pulls expensive, and the engine can install microG from a device-local
// file instead (Android/data/<pkg>/files/microG.apk).
tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.endsWith('ReleaseAssets')) {
        t.dependsOn 'ensureMicroGAsset'
    }
}

android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId "top.niunaijun.blackbox"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        splits {
            abi {
                enable true
                reset()
                
                include 'armeabi-v7a', "arm64-v8a"
                universalApk true
            }
        }
    }

    // Pinned debug keystore (committed at signing/debug.keystore) so that CI
    // builds of every commit share one signature and can update in place
    // instead of forcing a wipe on each Actions run.
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        jniLibs {
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "BlackBox_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

